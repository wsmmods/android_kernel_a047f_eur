name: Build A04s Custom WSM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: sus
          fetch-depth: 0

      - name: Switch to v3
        run: |
          git checkout 45ba5ed
          git status
          git describe --tags --always

      - name: Prepare build script
        run: |
          sed -i '/make ${ARGS} menuconfig/d' build.sh

      - name: Configure kernel
        run: |
          sed -i '/^CONFIG_KALLSYMS_ALL=/d' arch/arm64/configs/a04s.config
          sed -i '/^CONFIG_DEBUG_KERNEL=/d' arch/arm64/configs/a04s.config
          sed -i '/^CONFIG_LOCALVERSION=/d' arch/arm64/configs/a04s.config

          echo 'CONFIG_KALLSYMS_ALL=y' >> arch/arm64/configs/a04s.config
          echo 'CONFIG_DEBUG_KERNEL=y' >> arch/arm64/configs/a04s.config
          echo 'CONFIG_LOCALVERSION="-Custom-WSM"' >> arch/arm64/configs/a04s.config

      - name: Build kernel
        run: |
          chmod +x build.sh
          BUILD_KERNEL_VERSION=Custom-WSM ./build.sh

      - name: Verify final configuration
        run: |
          echo "Checking final kernel configuration..."

          grep -E '^CONFIG_(KALLSYMS|DEBUG_KERNEL|LOCALVERSION)=' out/.config

          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          grep -q '^CONFIG_DEBUG_KERNEL=y$' out/.config
          grep -q '^CONFIG_LOCALVERSION="-Custom-WSM"$' out/.config

          echo "CONFIG_KALLSYMS_ALL=y confirmed."
          echo "CONFIG_DEBUG_KERNEL=y confirmed."
          echo "CONFIG_LOCALVERSION=-Custom-WSM confirmed."

      - name: Verify kernel image
        run: |
          echo "Kernel image:"
          ls -lh out/arch/arm64/boot/Image

          echo "Build directory:"
          ls -lh build/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A04s-4.19.198-Custom-WSM
          path: |
            build/*.tar
            out/arch/arm64/boot/Image
